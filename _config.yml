title: SpaceNet Hub
description: A hub for space networking research.
theme: jekyll-theme-slate

plugins:
 - jekyll-scholar

scholar:
  style: apa
  locale: en

  source: ./bibliography
  bibliography: references.bib

  relative: "/bibliography.html"

  bibliography_template: bib-entry
  sort_by: year,title
  order: descending,ascending
  bibtex_skip_fields: [abstract, annote, category, month_numeric]
